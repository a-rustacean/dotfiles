name: Build NixOS ISO

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which architecture to build"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - x86_64
          - aarch64

jobs:
  # ─────────────────────────────────────────────
  # x86_64 build
  # ─────────────────────────────────────────────
  build-x86_64:
    name: Build ISO (x86_64-linux)
    runs-on: ubuntu-24.04
    if: ${{ inputs.target == 'both' || inputs.target == 'x86_64' }}

    permissions:
      id-token: write   # required by some Cachix auth flows
      contents: read

    steps:
      - name: Free up disk space
        # GitHub runners ship with a lot of pre-installed software that eats
        # into the ~14 GB available. Removing the biggest offenders gives Nix
        # the headroom it needs for a full ISO build.
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h

      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = auto
            cores = 0
            system-features = nixos-test benchmark big-parallel kvm
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ISO (x86_64-linux)
        run: |
          nix build .#nixosConfigurations.live.config.system.build.isoImage \
            --print-build-logs \
            --show-trace

      - name: Push build closure to Cachix
        run: |
          nix path-info --recursive ./result \
            | cachix push ${{ vars.CACHIX_CACHE_NAME }}

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-iso-x86_64
          path: result/iso/*.iso
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────
  # aarch64 build
  # ─────────────────────────────────────────────
  build-aarch64:
    name: Build ISO (aarch64-linux)
    # ubuntu-24.04-arm is free for PUBLIC repositories.
    # For PRIVATE repositories replace with a paid arm64 larger runner label,
    # e.g. "ubuntu-24.04-arm64-4core" (organisation/enterprise plan required).
    runs-on: ubuntu-24.04-arm
    if: ${{ inputs.target == 'both' || inputs.target == 'aarch64' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/.ghcup
          df -h

      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            max-jobs = auto
            cores = 0
            system-features = nixos-test benchmark big-parallel
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ISO (aarch64-linux)
        run: |
          nix build .#nixosConfigurations.live.config.system.build.isoImage \
            --print-build-logs \
            --show-trace

      - name: Push build closure to Cachix
        run: |
          nix path-info --recursive ./result \
            | cachix push ${{ vars.CACHIX_CACHE_NAME }}

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-iso-aarch64
          path: result/iso/*.iso
          if-no-files-found: error
          retention-days: 7
