theme = "catppuccin_mocha"

[editor]
soft-wrap.enable = true
auto-format = true

line-number = "relative"
true-color = true
rulers = [
  80,
  100
]
cursorline = true
color-modes = true
trim-final-newlines = true
trim-trailing-whitespace = true

popup-border = "none"

end-of-line-diagnostics = "hint"

[editor.statusline]
left = [
  "mode",
  "spinner",
  "spacer",
  "spacer",
  "version-control",
]

center = [
  "read-only-indicator",
  "file-base-name",
  "file-modification-indicator",
]

right = [
  "diagnostics",
  "selections",
  "position",
  "file-encoding",
  "file-line-ending",
  "file-type",
]

separator = "|"

[editor.statusline.mode]
normal = "󰚄 NOR"
insert = "󰚄 INS"
select = "󰚄 SEL"

[editor.lsp]
display-messages = true
display-progress-messages = true
display-inlay-hints = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "block"

[editor.file-picker]
max-depth = 10

[editor.whitespace.render]
space = "all"
tab = "all"
nbsp = "all"
nnbsp = "all"
newline = "none"

[editor.whitespace.characters]
space = "·"
nbsp = "⍽"
nnbsp = "␣"
tab = "→"
tabpad = "·"

[editor.indent-guides]
render = true
character = "│"
skip-levels = 1

[editor.inline-diagnostics]
cursor-line = "warning"
other-lines = "error"
max-diagnostics = 3
